name: solo90-moondesk
services:
  desk:
    build:
      context: .
      args:
        MOONDESK_RUNTIME_IMAGE: ${MOONDESK_RUNTIME_IMAGE:-python:3.12-slim}
    image: ${MOONDESK_IMAGE:-solo90-moondesk:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    ports:
      - "127.0.0.1:${MOONDESK_PORT:-19890}:8000"
    volumes:
      - moon-data:/var/lib/moondesk
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/moon/health', timeout=3).status == 200"]
      interval: 3s
      timeout: 4s
      retries: 12
volumes:
  moon-data:
